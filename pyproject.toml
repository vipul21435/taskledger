[project]
name = "taskledger"
version = "0.1.0"
description = "Submission pipeline tooling for benchmark-task teams: bundle linting, content-addressed dedupe, a shared collision ledger, build locks and review gates."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vipul Raj Jha" }]
requires-python = ">=3.12,<3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
]

[project.scripts]
taskledger = "taskledger.cli:app"

[project.urls]
Repository = "https://github.com/vipul21435/taskledger"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taskledger"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
