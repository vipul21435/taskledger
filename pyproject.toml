[project]
name = "taskledger"
version = "0.1.0"
description = "Submission pipeline tooling for benchmark-task teams: bundle linting, content-addressed dedupe, a shared collision ledger, build locks and review gates."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vipul Raj Jha" }]
requires-python = ">=3.12,<3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "alembic>=1.14",
    "pydantic>=2.9",
    "sqlalchemy>=2.0.36",
    "typer>=0.12",
]

[project.scripts]
taskledger = "taskledger.cli:app"

[project.urls]
Repository = "https://github.com/vipul21435/taskledger"

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taskledger"]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "N", "PT", "RET", "PL", "S", "TID", "PTH",
]
ignore = [
    "PLR0913", # CLI commands and config objects legitimately take many arguments
    "PLR2004", # magic values are fine in comparisons against spec constants
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S603", "S607"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
warn_unreachable = true
pretty = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "slow: tests that spawn processes or take more than a second",
    "docker: tests that need a working Docker daemon",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["taskledger"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
