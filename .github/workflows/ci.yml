name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python 3.12 and dependencies
        run: |
          uv python install 3.12
          uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: mypy (strict)
        run: uv run mypy

      - name: pytest with coverage
        env:
          HYPOTHESIS_PROFILE: ci
        run: uv run pytest -q --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  demo:
    name: demo (host and container)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: make demo
        run: |
          uv python install 3.12
          uv sync --frozen
          make demo

      - name: Build the image
        run: docker build -t taskledger:ci .

      - name: Run the demo inside the image
        run: docker run --rm --entrypoint bash taskledger:ci /opt/taskledger/scripts/demo.sh

  sarif:
    name: lint SARIF upload to code scanning
    # Fork pull requests get a read-only token, so only upload from pushes.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Lint the sample bundles as SARIF 2.1.0
        run: |
          uv python install 3.12
          uv sync --frozen
          uv run taskledger lint --format sarif examples/bundles/* > lint.sarif
          uv run python -c "import json, sys; from taskledger.lint import sarif_problems; problems = sarif_problems(json.load(open('lint.sarif'))); print(problems or 'no SARIF problems'); sys.exit(bool(problems))"

      - name: Upload to GitHub code scanning (fails if GitHub cannot process it)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: lint.sarif
          category: taskledger-lint
          wait-for-processing: true
